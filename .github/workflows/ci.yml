name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-research.txt
            requirements-dl.txt
      - name: Install core and research test environment
        run: python -m pip install -r requirements-dev.txt -r requirements-research.txt
      - name: Install CPU-only deep-learning test runtime
        run: python -m pip install "torch>=2.0.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Verify dependency graph
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check src tests
