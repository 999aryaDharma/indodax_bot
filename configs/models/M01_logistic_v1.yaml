model_id: "M01"
version: "1.0.0"
family: "linear"
description: "Calibrated elastic-net logistic regression baseline"
parameters:
  penalty: "elasticnet"
  solver: "saga"
  C: 0.1
  l1_ratio: 0.5
  class_weight: "balanced"
  seed: 42
  max_iter: 1000
thresholds:
  min_positive_samples: 10
  min_minority_ratio: 0.05
